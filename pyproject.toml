[project]
name = "pytorch-workshop"
version = "0.1.1"
description = "A comprehensive resource to master PyTorch, from basics to advanced techniques, for deep learning enthusiasts and practitioners"
authors = [
    {name = "Amirhossein Heydari", email =  "amirhosseinheydari78@gmail.com"}
]
maintainers = [
    {name = "Amirhossein Heydari", email =  "amirhosseinheydari78@gmail.com"}
]
keywords = ["PyTorch", "deep learning", "machine learning", "neural networks"]
readme = "README.md"
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "assets/images/original/LICENSE"
]
requires-python = ">=3.14.7"
dependencies = [
    "ipykernel>=7.3.0,<8.0.0",
    "ipympl>=0.10.0,<1.0.0",
    "ipywidgets>=8.1.9,<9.0.0",
    "datasets>=5.0.1,<6.0.0",
    "matplotlib>=3.11.2,<4.0.0",
    "numpy>=2.5.3,<3.0.0",
    "opencv-python>=5.0.0.93,<6.0.0",
    "pandas>=3.0.6,<4.0.0",
    "scikit-learn>=1.9.1,<2.0.0",
    "seaborn>=0.13.2,<1.0.0",
    "soundfile>=0.14.0,<1.0.0",
    "torchinfo>=1.8.0,<2.0.0",
    "torchmetrics>=1.9.0,<2.0.0",
]

[project.urls]
Repository = "https://github.com/mr-pylin/pytorch-workshop"
MyHomepage = "https://mr-pylin.github.io"

[project.optional-dependencies]
cpu = [
    "torch==2.14.0",
    "torchvision==0.29.0",
]
cuda = [
    "torch==2.14.0",
    "torchvision==0.29.0",
]
rocm = [
    "torch==2.14.0",
    "torchvision==0.29.0",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cuda" },
    { extra = "rocm" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu132", extra = "cuda" },
#   { index = "pytorch-rocm714", extra = "rocm" },
]

torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu132", extra = "cuda" },
#   { index = "pytorch-rocm714", extra = "rocm" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm714"
url = "https://download.pytorch.org/whl/rocm7.14"
explicit = true

[tool.black]
line-length = 120
